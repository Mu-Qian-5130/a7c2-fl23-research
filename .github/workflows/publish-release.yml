name: Publish draft release
# Push build/publish-<tag> to publish the draft created by release.yml, after
# checking that all three expected assets are attached.
on:
  push:
    branches: ['build/publish-*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check assets and publish
        run: |
          # Notes committed on the publish branch replace the draft's notes.
          if [ -f release-assets/notes.md ]; then
            gh release edit "${GITHUB_REF_NAME#build/publish-}" --repo "$GITHUB_REPOSITORY" --notes-file release-assets/notes.md
          fi
          tag="${GITHUB_REF_NAME#build/publish-}"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .assets[].name" > assets.txt
          cat assets.txt
          for name in A7C2Tools-Windows-x64.zip A7C2Tools-macOS-arm64.dmg "A7C2-Looks-and-DCP-${tag#v}.zip"; do
            grep -qx "$name" assets.txt || { echo "Missing asset: $name"; exit 1; }
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
